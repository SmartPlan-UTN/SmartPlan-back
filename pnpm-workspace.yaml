# pnpm configuration. Since pnpm 10.6, these settings live here rather than in
# the "pnpm" field in package.json.

# pnpm 10+ blocks dependency installation scripts and aborts any
# `pnpm <script>` with ERR_PNPM_IGNORED_BUILDS until each one is reviewed.
# The decision is versioned here so it is consistent on every machine and in CI.
allowBuilds:
  # postinstall = "opencollective" only prints a donation request.
  '@nestjs/core': false
  # It runs no application code during installation; the client works without
  # its build script.
  '@google/genai': false
  # Transitive dependency of @golevelup/nestjs-rabbitmq; it needs no native
  # compilation to run.
  protobufjs: false
  # postinstall links the native resolver binary used by ESLint.
  unrs-resolver: true
  # Compiles or downloads the native binding that runs Argon2id at runtime.
  argon2: true
  '@scarf/scarf': false
