services:
  postgres:
    image: postgres:16-alpine
    container_name: smartplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-smartplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartplan}
      POSTGRES_DB: ${DB_NAME:-smartplan}
    ports:
      # El puerto del host sale de DB_PORT: si ya tenés otro PostgreSQL en 5432,
      # cambiá DB_PORT en el .env y no hace falta tocar este archivo.
      - '${DB_PORT:-5432}:5432'
    volumes:
      - smartplan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-smartplan} -d ${DB_NAME:-smartplan}']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: smartplan-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smartplan}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartplan}
    ports:
      # Mismo criterio que PostgreSQL: el puerto del host sale del .env, así
      # que si ya tenés un RabbitMQ en 5672 lo cambiás ahí sin tocar este
      # archivo.
      - '${RABBITMQ_PORT:-5672}:5672'
      # Panel de administración: http://localhost:15672
      - '${RABBITMQ_PANEL_PORT:-15672}:15672'
    volumes:
      - smartplan_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 10s
      retries: 10
      # RabbitMQ tarda más que Postgres en estar listo; sin esto el
      # healthcheck lo marca unhealthy en el arranque.
      start_period: 30s

volumes:
  smartplan_postgres_data:
  smartplan_rabbitmq_data:
